# Settings wetfish/server fills in when it adds EzTaxes, written to
# laravel/.env from laravel/.env.example. See "Project Setup" in
# https://github.com/wetfish/server/blob/main/docs/how-it-works.md
#
# <env file>   <variable>   <value>
laravel/.env APP_KEY      random laravel-key
laravel/.env APP_URL      url
laravel/.env DB_HOST      database host
laravel/.env DB_PORT      database port
laravel/.env DB_DATABASE  database name
laravel/.env DB_USERNAME  database user
laravel/.env DB_PASSWORD  database password
laravel/.env DEMO_MODE    ask Read-only demo with fictional data (true or false)
