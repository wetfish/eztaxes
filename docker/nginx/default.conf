server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /var/www/laravel/public;
    index index.php;

    # The visitor's address, which wetfish/server's Caddy sends in X-Real-IP,
    # trusted only from Docker's private networks
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Docker's DNS server. A variable in fastcgi_pass makes nginx look the PHP
    # container up again when the answer expires, since a deploy replaces it
    # with one at a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream php:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
